name: Apply the 1.9.0 change

# One-shot: runs dev/ship.py, commits what it changes and pushes. Both files delete themselves.
on:
  push:
    branches: [main]
    paths: ['dev/ship.py']

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Apply, commit and push
        run: |
          set -e
          git config user.name "AnekTheGreat"
          git config user.email "166177289+AnekTheGreat@users.noreply.github.com"
          python3 dev/ship.py
          rm -f dev/ship.py .github/workflows/apply-190.yml
          git add -A
          git commit -m "UJournal 1.9.0: birthdays from FamTM are one button, and the screen says what changed"
          git push origin HEAD:main
