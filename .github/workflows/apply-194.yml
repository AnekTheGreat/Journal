name: Apply 1.9.4

# One-shot: applies dev/patch-194.py, checks what it wrote, and commits it.
# The release itself is cut afterwards by release.yml with version 1.9.4.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-194
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply the patch
        run: python3 dev/patch-194.py

      - name: Check what it wrote
        run: |
          python3 - <<'PY'
          import sys

          page = open('app/src/main/assets/index.html', encoding='utf-8').read()
          for need in ('const JOURNAL_PAGE = "1.9.4";', '"1.9.4": {', '--rose:#BE8681',
                       '.grid button.bd{background:var(--rose);color:#fff}',
                       'var bday = {}', 'var bd = bday[k.slice(5)]',
                       'cal-key', 'function autoSync()', 'if (n === 2) autoSync();',
                       'refresh(); autoSync();', 'Following FamTM'):
              if need not in page:
                  sys.exit('the page is missing %r' % need)
          # a birthday must no longer be counted as a plan day, or it would be drawn tan as well
          cal = page.split('function drawCal')[1].split('function draw')[0]
          if 'planned[String(p.start).slice(5)] = 1' in cal:
              sys.exit('a birthday still marks the plan map, so it would be drawn tan')
          if 'bday[String(p.start).slice(5)] = 1' not in cal:
              sys.exit('the calendar has no birthday map')

          g = open('app/build.gradle.kts', encoding='utf-8').read()
          if 'versionName = "1.9.4"' not in g:
              sys.exit('versionName is not 1.9.4')
          n = open('PATCH_NOTES.md', encoding='utf-8').read()
          if '## 1.9.4 — November 6, 2026' not in n:
              sys.exit('PATCH_NOTES has no 1.9.4 entry')
          print('1.9.4: auto-sync, rose birthdays, key, notes')
          PY
          node - <<'JS'
          const fs = require('fs');
          const html = fs.readFileSync('app/src/main/assets/index.html', 'utf8');
          const blocks = [...html.matchAll(/<script(?![^>]*\bsrc=)(?![^>]*application\/json)[^>]*>([\s\S]*?)<\/script>/g)];
          if (!blocks.length) throw new Error('no script blocks found');
          for (const b of blocks) new Function(b[1]);   // parses, does not run
          console.log('page: ' + blocks.length + ' script block(s) parse');
          JS

      - name: Commit and push
        run: |
          git config user.name "AnekTheGreat"
          git config user.email "anekthegreat@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "already applied - nothing to commit"
            exit 0
          fi
          git commit -m "UJournal 1.9.4: birthdays add themselves, and a birthday is rose rather than tan"
          git push
