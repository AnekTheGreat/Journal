name: Apply 1.9.8

# One-shot: applies dev/patch-198.py, proves it is idempotent and that the gear, the tabs and the
# family list are what it says, and commits it. Page only - no APK, so this ships over the air.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-198
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply the patch, twice
        run: |
          python3 dev/patch-198.py
          A="$(git diff | sha1sum)"
          python3 dev/patch-198.py
          B="$(git diff | sha1sum)"
          if [ "$A" != "$B" ]; then echo "::error::a second run changed something"; exit 1; fi
          echo "idempotent: the same diff after a second run"
          python3 dev/patch-198.py --check

      - name: Check what it wrote
        run: |
          python3 - <<'PY'
          import re, sys
          page = open('app/src/main/assets/index.html', encoding='utf-8').read()
          probes = [
              ('const JOURNAL_PAGE = "1.9.8";', 'the page does not say 1.9.8'),
              ('"1.9.8": {', 'the What New notes have no 1.9.8 entry'),
              ('id="set"', 'there is no gear in the top bar'),
              ('data-settab="', 'the settings tabs are not rendered'),
              ('var SETTABS', 'the tabs are not defined'),
              ('["famtm"', 'FamTM is missing from the family list'),
              ('["myhub"', 'My Hub is missing from the family list'),
              ('["sidecut"', 'SideCut is missing from the family list'),
              ('["measuret"', 'MeasureT is missing from the family list'),
              ('prev ? prev.scrollLeft : 0', 'the tab strip still forgets where it was'),
              ('r.right > b.right', 'the picked tab is not brought into view'),
              ('$("set").onclick', 'the gear is not wired'),
          ]
          for probe, why in probes:
              if probe not in page:
                  sys.exit(why)
          print('1.9.8: gear wired, five tabs, four apps, strip keeps its place')
          PY
          node - <<'JS'
          const fs = require('fs');
          const html = fs.readFileSync('app/src/main/assets/index.html', 'utf8');
          const blocks = [...html.matchAll(/<script(?![^>]*\bsrc=)(?![^>]*application\/json)[^>]*>([\s\S]*?)<\/script>/g)];
          for (const b of blocks) new Function(b[1]);
          console.log('page: ' + blocks.length + ' script block(s) parse');
          JS

      - name: Commit and push
        run: |
          git config user.name "AnekTheGreat"
          git config user.email "anekthegreat@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "already applied - nothing to commit"
            exit 0
          fi
          git commit -m "UJournal 1.9.8: one gear, tabs, and the whole family in Other apps"
          git push
