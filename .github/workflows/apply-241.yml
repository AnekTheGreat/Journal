name: Apply 2.4.1 to the page

# The release build refuses a page whose version disagrees with the APK versionName:
# "the page names 2.4 but the build names 2.4.1". So the page moves with the build: two edits.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch the page and push
        run: |
          python3 - <<'PY'
          import io, sys
          P = 'app/src/main/assets/index.html'
          s = io.open(P, encoding='utf-8').read()
          if 'JOURNAL_PAGE = "2.4.1"' in s:
              print('already applied')
          else:
              old = 'const JOURNAL_PAGE = "2.4";'
              if s.count(old) != 1:
                  sys.exit('FATAL: the page is not on 2.4')
              s = s.replace(old, 'const JOURNAL_PAGE = "2.4.1";', 1)

              anchor = '    "2.4": {'
              if s.count(anchor) != 1:
                  sys.exit('FATAL: no 2.4 note to put this release above')
              note = ('A phone on 2.4 could still be drawing an old screen. The app keeps a copy of '
                      'the page it downloaded and only checked the clock on that copy against the '
                      'install, so a page fetched from an old address after the install looked newer '
                      'and stayed. The copy is now checked by version, and one older than the page '
                      'inside this build is thrown away on the next open. A download that is not newer '
                      'is refused as well, so the screen can only move forward.')
              entry = ('    "2.4.1": {\n'
                       '      date: "14 November 2026",\n'
                       '      title: "The page cannot fall behind the app",\n'
                       '      notes: [\n'
                       '        "' + note + '"\n'
                       '      ]\n'
                       '    },\n')
              s = s.replace(anchor, entry + anchor, 1)
              io.open(P, 'w', encoding='utf-8').write(s)
              print('applied: the page is 2.4.1 with this release notes')
          PY

          grep -q 'JOURNAL_PAGE = "2.4.1"' app/src/main/assets/index.html
          grep -q '"2.4.1": {' app/src/main/assets/index.html
          node -e "const fs=require('fs');const h=fs.readFileSync('app/src/main/assets/index.html','utf8');const m=h.match(/<script>([\\s\\S]*?)<\\/script>/);if(!m)process.exit(1);new Function(m[1]);console.log('page script parses');"
          git config user.name UJournal
          git config user.email actions@users.noreply.github.com
          git add app/src/main/assets/index.html
          if git diff --cached --quiet; then echo 'nothing to commit'; exit 0; fi
          git commit -m 'The page is 2.4.1 and says what changed'
          git push
