name: Build APK + AAB

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Assemble debug and release APK + AAB
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # No key material is in the repository. The keystore arrives from the KEYSTORE_BASE64
      # secret and exists only for the length of this job, in the runner's temp directory.
      - name: Reconstruct the signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::the KEYSTORE_BASE64 secret is not set for this repository"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/ujournal.jks"
          echo "SIGNING_STORE_FILE=$RUNNER_TEMP/ujournal.jks" >> "$GITHUB_ENV"

      # Both formats, both build types: assemble* = APK, bundle* = AAB. The version is whatever
      # build.gradle.kts says, so this build and the release it is compared against agree.
      - name: Assemble
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          SIGNING_KEY_ALIAS: ujournal
        run: |
          gradle :app:assembleDebug :app:assembleRelease \
                 :app:bundleDebug :app:bundleRelease \
                 --no-daemon --stacktrace

      # An unsigned build is not a failed build, so the output has to be named to be checked:
      # AGP writes app-release-unsigned.apk when no signing config reached it. The AAB has the
      # same trap - it is written, unsigned, and Play only refuses it later.
      - name: Check the release APK is signed and both AABs exist
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          AAB=app/build/outputs/bundle/release/app-release.aab
          DAAB=app/build/outputs/bundle/debug/app-debug.aab
          if [ ! -f "$APK" ]; then
            echo "::error::the release APK is unsigned - the signing secrets did not reach the build"
            ls -l app/build/outputs/apk/release/ || true
            exit 1
          fi
          for f in "$AAB" "$DAAB"; do
            if [ ! -f "$f" ]; then
              echo "::error::$f was not produced - bundleDebug/bundleRelease did not run"
              ls -l app/build/outputs/bundle/ || true
              exit 1
            fi
          done
          echo "signed and packaged: $APK ($(du -h "$APK" | cut -f1)), $AAB ($(du -h "$AAB" | cut -f1))"

      # Flat, versioned names in one folder, the way a release is laid out - the same shape
      # SideCut's releases have, where the APK and the AAB sit side by side. The version comes
      # from build.gradle.kts: an artifact named after the run number could not be told apart
      # from the release it is supposed to replace.
      - name: Name the outputs
        run: |
          V="$(grep -oE 'versionName = "[^"]+"' app/build.gradle.kts | head -1 | cut -d'"' -f2)"
          if [ -z "$V" ]; then echo "::error::could not read versionName"; exit 1; fi
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk        "dist/UJournal-$V-debug.apk"
          cp app/build/outputs/apk/release/app-release.apk    "dist/UJournal-$V.apk"
          cp app/build/outputs/bundle/debug/app-debug.aab     "dist/UJournal-$V-debug.aab"
          cp app/build/outputs/bundle/release/app-release.aab "dist/UJournal-$V.aab"
          echo '--- dist ---'
          ls -l dist

      - name: Upload APKs and AABs
        uses: actions/upload-artifact@v4
        with:
          name: UJournal-apk-aab
          path: dist/*
          if-no-files-found: error
