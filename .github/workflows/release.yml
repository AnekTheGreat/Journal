name: Release APK + AAB

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, e.g. 1.3.0'
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Signed APK, AAB and GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Reconstruct the signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::the KEYSTORE_BASE64 secret is not set for this repository"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/ujournal.jks"
          echo "SIGNING_STORE_FILE=$RUNNER_TEMP/ujournal.jks" >> "$GITHUB_ENV"

      - name: Resolve version
        id: v
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="${{ inputs.version }}"
          fi
          if [ -z "$V" ]; then echo "no version resolved"; exit 1; fi
          echo "name=$V" >> "$GITHUB_OUTPUT"
          echo "releasing $V"

      # The APK carries the version in build.gradle.kts, the page carries it again, and the app's
      # updater compares both against this release. If they disagree, every installed copy is
      # offered a release it will refuse, so the mismatch stops the run here.
      - name: Check the tag matches the version the APK will carry
        run: |
          BUILT="$(grep -oE 'versionName = "[^"]+"' app/build.gradle.kts | head -1 | cut -d'"' -f2)"
          PAGE="$(grep -oE 'JOURNAL_PAGE = "[^"]+"' app/src/main/assets/index.html | head -1 | cut -d'"' -f2)"
          echo "tag says ${{ steps.v.outputs.name }}, gradle says $BUILT, the page says $PAGE"
          if [ "$BUILT" != "${{ steps.v.outputs.name }}" ]; then
            echo "::error::build.gradle.kts names $BUILT but this release is ${{ steps.v.outputs.name }}"
            exit 1
          fi
          if [ "$PAGE" != "$BUILT" ]; then
            echo "::error::the page names $PAGE but the build names $BUILT"
            exit 1
          fi
          grep -q 'ujournal-page' app/src/main/assets/index.html \
            || { echo "::error::the page lost its ujournal-page marker"; exit 1; }

      # A release publishes both formats: the APK for a phone, the AAB for Play Console.
      - name: Build signed release APK and AAB
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          SIGNING_KEY_ALIAS: ujournal
        run: gradle :app:assembleRelease :app:bundleRelease --no-daemon --stacktrace

      - name: Name the files
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          AAB=app/build/outputs/bundle/release/app-release.aab
          STATUS=0
          if [ ! -f "$APK" ]; then
            echo "::error::no signed APK was produced - check the SIGNING_* secrets"
            STATUS=1
          fi
          if [ ! -f "$AAB" ]; then
            echo "::error::no AAB was produced by bundleRelease"
            STATUS=1
          fi
          [ "$STATUS" -eq 0 ] || exit 1
          cp "$APK" "UJournal-${{ steps.v.outputs.name }}.apk"
          cp "$AAB" "UJournal-${{ steps.v.outputs.name }}.aab"
          ls -l UJournal-*

      # The manifest the installed app reads, the same one every other app here publishes beside
      # itself: version, the file to fetch, its size, the notes for it taken from PATCH_NOTES - and
      # now the page, which is the journal's screen. The page fields are what make an update
      # installable without an installer: the app fetches that one file, checks its marker and its
      # version, and loads it. page_url is pinned to this tag, so the screen a release is published
      # with is the screen an update downloads, not whatever the branch says later.
      #
      # A note in the markdown wraps over several lines and sits under ### Added / ### Fixed, so
      # those subheadings are skipped rather than treated as the end of the entry, and a wrapped
      # line is joined back onto the bullet it belongs to. If no note is found the run stops: an
      # update that announces nothing is worse than no release.
      - name: Write the update manifest
        run: |
          python3 - "${{ steps.v.outputs.name }}" "UJournal-${{ steps.v.outputs.name }}.apk" <<'PY'
          import hashlib, json, os, re, sys
          version, apk = sys.argv[1], sys.argv[2]
          page = 'app/src/main/assets/index.html'
          notes = []
          try:
              md = open('PATCH_NOTES.md', encoding='utf-8').read()
              m = re.search(r'^##\s+' + re.escape(version) + r'\b.*?$(.*?)(?=^##\s|\Z)', md, re.S | re.M)
              if m is None:
                  m = re.search(r'^##\s+.*?$(.*?)(?=^##\s|\Z)', md, re.S | re.M)
              if m:
                  for line in m.group(1).splitlines():
                      s = line.strip()
                      if not s:
                          continue
                      if s.startswith('###'):
                          continue
                      if s.startswith('##'):
                          break
                      if s.startswith('#'):
                          continue
                      if s.startswith(('- ', '* ')):
                          notes.append(s[2:].strip())
                      elif notes:
                          notes[-1] += ' ' + s
          except OSError as e:
              sys.exit('PATCH_NOTES.md could not be read: %s' % e)
          notes = [re.sub(r'\*{1,2}|`', '', n) for n in notes]
          if not notes:
              sys.exit('no patch notes found under %s - write them before releasing' % version)
          raw = open(page, 'rb').read()
          manifest = {
              'version': version,
              'apk': apk,
              'size': os.path.getsize(apk),
              'notes': notes[:6],
              'page': version,
              'page_size': len(raw),
              'page_sha256': hashlib.sha256(raw).hexdigest(),
              'page_url': 'https://raw.githubusercontent.com/AnekTheGreat/Journal/v%s/%s' % (version, page),
              'date': '',
          }
          with open('updates.json', 'w', encoding='utf-8') as f:
              json.dump(manifest, f, ensure_ascii=False)
          print(open('updates.json', encoding='utf-8').read())
          PY

      # Play's two hard checks, run before anything is published: an upload must target API 36 or
      # newer, and it must not ask to install other packages. Both are one grep away, and neither
      # is worth discovering in a review queue days later. The scene of checks also covers the
      # bundle's own copy of the page, because Play ships the shell and the page together.
      - name: Check the build is Play-ready
        run: |
          grep -q 'compileSdk = 36' app/build.gradle.kts \
            || { echo "::error::compileSdk is not 36 - AGP 8.10 is needed for API 36"; exit 1; }
          grep -q 'targetSdk = 36' app/build.gradle.kts \
            || { echo "::error::targetSdk is not 36 - Play refuses a bundle that targets less"; exit 1; }
          # Grep only real declarations, never prose: the manifest's own comments mention the
          # permission by name to explain why it is gone, and matching a comment failed the v1.5.0
          # release after it had already built the APK.
          python3 - <<'CHECK'
          import re, sys
          x = open('app/src/main/AndroidManifest.xml', encoding='utf-8').read()
          x = re.sub(r'<!--.*?-->', '', x, flags=re.S)
          if re.search(r'<uses-permission[^>]*REQUEST_INSTALL_PACKAGES', x, re.S):
              sys.exit('::error::the manifest asks to install packages, which Play reads as a self-updater')
          print('manifest declares no install-packages permission')
          CHECK
          unzip -l "UJournal-${{ steps.v.outputs.name }}.aab" | grep -q 'base/assets/index.html' \
            || { echo "::error::the bundle carries no screen page"; exit 1; }
          echo "Play-ready: API 36, no install-packages permission, signed AAB with its page"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.name }}
          name: UJournal ${{ steps.v.outputs.name }}
          files: |
            UJournal-${{ steps.v.outputs.name }}.apk
            UJournal-${{ steps.v.outputs.name }}.aab
            updates.json
          generate_release_notes: true
