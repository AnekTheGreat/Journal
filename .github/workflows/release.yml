name: Release APK + AAB

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, e.g. 1.2.0'
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Signed APK, AAB and GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Reconstruct the signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::the KEYSTORE_BASE64 secret is not set for this repository"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/ujournal.jks"
          echo "SIGNING_STORE_FILE=$RUNNER_TEMP/ujournal.jks" >> "$GITHUB_ENV"

      - name: Resolve version
        id: v
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="${{ inputs.version }}"
          fi
          if [ -z "$V" ]; then echo "no version resolved"; exit 1; fi
          echo "name=$V" >> "$GITHUB_OUTPUT"
          echo "releasing $V"

      # The APK carries the version in build.gradle.kts, and the app's updater compares its own
      # version with the release tag. If the two disagree, every installed copy is offered a
      # release it will then refuse to install, so the mismatch stops the run here instead.
      - name: Check the tag matches the version the APK will carry
        run: |
          BUILT="$(grep -oE 'versionName = "[^"]+"' app/build.gradle.kts | head -1 | cut -d'"' -f2)"
          echo "tag says ${{ steps.v.outputs.name }}, gradle says $BUILT"
          if [ "$BUILT" != "${{ steps.v.outputs.name }}" ]; then
            echo "::error::build.gradle.kts names $BUILT but this release is ${{ steps.v.outputs.name }}"
            exit 1
          fi

      # A release publishes both formats: the APK for a phone, the AAB for Play Console.
      - name: Build signed release APK and AAB
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          SIGNING_KEY_ALIAS: ujournal
        run: gradle :app:assembleRelease :app:bundleRelease --no-daemon --stacktrace

      - name: Name the files
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          AAB=app/build/outputs/bundle/release/app-release.aab
          STATUS=0
          if [ ! -f "$APK" ]; then
            echo "::error::no signed APK was produced - check the SIGNING_* secrets"
            STATUS=1
          fi
          if [ ! -f "$AAB" ]; then
            echo "::error::no AAB was produced by bundleRelease"
            STATUS=1
          fi
          [ "$STATUS" -eq 0 ] || exit 1
          cp "$APK" "UJournal-${{ steps.v.outputs.name }}.apk"
          cp "$AAB" "UJournal-${{ steps.v.outputs.name }}.aab"
          ls -l UJournal-*

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.name }}
          name: UJournal ${{ steps.v.outputs.name }}
          files: |
            UJournal-${{ steps.v.outputs.name }}.apk
            UJournal-${{ steps.v.outputs.name }}.aab
          generate_release_notes: true
