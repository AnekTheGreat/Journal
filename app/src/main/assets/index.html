<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>UJournal</title>
<!--
  ujournal-page

  Every published copy of this screen carries this word. PageStore refuses a download that does not
  contain it, and a page that names another version than the release promised is refused too, so a
  half-finished file or an error page can never become the journal.
-->
<style>
:root{--bg:#F4EBDD;--card:#FBF6EC;--tan:#C8AD8D;--sand:#E6D5BC;--ink:#4A3F35;--muted:#9C8B77}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:-apple-system,Roboto,system-ui,sans-serif}
body{display:flex;flex-direction:column}
header#bar{display:flex;align-items:center;gap:6px;padding:14px 16px 8px}
#brand{font-family:Georgia,serif;font-size:24px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#check,#more,#tip{background:none;border:0;color:var(--muted);font-size:20px;padding:6px 8px}
#tip{color:var(--tan);font-size:19px}
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 16px 96px}
nav#tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--sand);padding:6px 0 8px}
nav#tabs button{flex:1;background:none;border:0;color:var(--muted);font-size:19px;display:flex;flex-direction:column;gap:2px;align-items:center}
nav#tabs button span{font-size:11px;letter-spacing:.4px}
nav#tabs button.on{color:var(--ink);background:var(--sand);border-radius:14px;margin:0 10px}
#fab{position:fixed;right:20px;bottom:78px;width:56px;height:56px;border-radius:28px;border:0;background:var(--tan);color:#fff;font-size:26px;line-height:1;box-shadow:0 6px 18px rgba(74,63,53,.22)}
#tabs.hide,#fab.hide{display:none}
.hello{font-family:Georgia,serif;font-size:30px;padding:10px 2px 14px}
.newj{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--tan);color:#fff;border:0;border-radius:22px;padding:19px 18px;margin:0 0 18px;box-shadow:0 8px 20px rgba(74,63,53,.18)}
.newj .plus{font-size:30px;line-height:1;width:34px;text-align:center}
.newj b{display:block;font-family:Georgia,serif;font-size:20px;font-weight:400}
.newj i{display:block;font-style:normal;font-size:12.5px;opacity:.88;margin-top:4px}
.jname{font-family:Georgia,serif;font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chev{color:var(--tan);font-size:26px;line-height:1;padding-left:8px}
.allj{display:block;width:100%;background:none;border:0;color:var(--muted);font-size:14px;padding:14px 4px;text-align:center}
.year{font-family:Georgia,serif;font-size:32px;padding:16px 2px 2px}
.month{color:var(--muted);font-size:12px;letter-spacing:2px;text-transform:uppercase;padding:10px 2px 6px}
.card{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:20px;padding:14px;margin-bottom:10px}
.card .dn{width:46px;text-align:center;flex:0 0 46px}
.card .dn b{display:block;font-family:Georgia,serif;font-size:25px;font-weight:400}
.card .dn i{font-style:normal;font-size:10px;color:var(--muted);letter-spacing:1px}
.card .txt{flex:1;min-width:0}
.card .ti{font-family:Georgia,serif;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .bd{color:var(--muted);font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .at{color:var(--tan);font-size:12px}
.thumb{width:64px;height:64px;border-radius:12px;object-fit:cover;flex:0 0 64px;background:var(--sand)}
.thumb.p{display:flex;align-items:center;justify-content:center;color:#fff;font-size:20px}
.empty{text-align:center;color:var(--muted);font-family:Georgia,serif;font-size:18px;padding:60px 20px 26px;line-height:1.6}
.support{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:20px;padding:16px 18px;margin:18px 0 8px}
.support .s1{font-family:Georgia,serif;font-size:16px}
.support .s2{color:var(--muted);font-size:12px;margin-top:3px}
.support .h{color:var(--tan);font-size:20px;margin-left:auto}
.fambtn{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--sand);border-radius:20px;padding:14px 16px;margin:0 0 18px;color:var(--ink);font-family:inherit}
.fambtn .fc{font-size:22px;line-height:1}
.fambtn b{display:block;font-family:Georgia,serif;font-size:16px;font-weight:400}
.fambtn i{display:block;font-style:normal;font-size:12.5px;color:var(--muted);margin-top:3px}
.plans{margin:2px 0 10px}
.plan{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:18px;padding:12px 14px;margin-bottom:8px}
.plan.today{border:1px solid var(--tan)}
.plan .pdn{width:42px;flex:0 0 42px;text-align:center}
.plan .pdn b{display:block;font-family:Georgia,serif;font-size:21px;font-weight:400}
.plan .pdn i{font-style:normal;font-size:9.5px;color:var(--muted);letter-spacing:1px}
.plan .pt{flex:1;min-width:0}
.plan .pt b{display:block;font-family:Georgia,serif;font-size:16px;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plan .pt i{display:block;font-style:normal;color:var(--muted);font-size:12.5px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plan .cake{font-size:17px}
.fld{width:100%;border:1px solid var(--sand);border-radius:14px;background:var(--card);color:var(--ink);font-family:inherit;font-size:15px;padding:12px 14px;margin:5px 0 12px;-webkit-appearance:none;appearance:none;box-shadow:0 1px 0 rgba(74,63,53,.03)}
.fld.ta{min-height:62px;resize:none}
.fl{display:block;font-size:10.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted);padding-top:2px}
.chips{display:flex;gap:8px;margin:6px 0}
.chip{border:1px solid var(--sand);background:none;border-radius:14px;padding:8px 15px;font-size:13.5px;color:var(--ink)}
.chip.on{background:var(--tan);border-color:var(--tan);color:#fff}
.durs{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px;-webkit-overflow-scrolling:touch}
.dur{flex:0 0 auto;border:1px solid var(--sand);background:var(--card);color:var(--ink);border-radius:999px;padding:9px 15px;font-size:13.5px;font-family:inherit}
.dur.on{background:var(--tan);border-color:var(--tan);color:#fff}
.two{display:flex;gap:10px}
.two>div{flex:1;min-width:0}
.cal-head{display:flex;align-items:center;gap:2px;padding:10px 0}
.cal-head button{background:none;border:0;color:var(--ink);font-size:20px;padding:6px 10px}
.cal-title{flex:1;text-align:center;font-family:Georgia,serif;font-size:20px}
.dow,.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dow span{text-align:center;color:var(--muted);font-size:11px;padding:4px 0}
.grid button{aspect-ratio:1;border:0;background:none;border-radius:50%;color:var(--ink);font-size:15px;position:relative}
.grid button.has{background:var(--tan);color:#fff}
.grid button.pl::after{content:"";position:absolute;left:50%;bottom:5px;width:4px;height:4px;margin-left:-2px;border-radius:2px;background:var(--tan)}
.grid button.has.pl::after{background:#fff}
.today{text-align:center;padding:14px}
.today button{background:none;border:0;color:var(--muted)}
#day{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column}
#day.hide,#sheet.hide,#menu.hide,#recbar.hide,#say.hide{display:none}
.day-bar{display:flex;align-items:center;padding:8px 10px}
.day-bar button{background:none;border:0;color:var(--ink);font-size:15px;padding:10px 12px}
#back{color:var(--muted);flex:1;text-align:left}
#day-body{flex:1;overflow-y:auto;padding:0 20px 120px}
.day-date{color:var(--muted);font-size:13px;padding:2px 16px 10px}
input.t{width:100%;border:0;background:none;font-family:Georgia,serif;font-size:27px;color:var(--ink);padding:6px 0;outline:none}
input.nm{font-size:22px}
textarea.b{width:100%;min-height:200px;border:0;background:none;font-size:17px;line-height:1.55;color:var(--ink);padding:6px 0;outline:none;resize:none;font-family:inherit}
.atts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding-top:10px}
.tile{position:relative;aspect-ratio:1;border-radius:14px;background:var(--sand);overflow:hidden}
.tile img{width:100%;height:100%;object-fit:cover}
.tile .ico{font-size:26px;text-align:center;padding-top:26px}
.tile .nm{font-size:10px;color:var(--ink);text-align:center;padding:4px 6px;overflow:hidden;max-height:28px}
.tile .play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:22px}
.tile .x{position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:11px;border:0;background:rgba(0,0,0,.42);color:#fff;font-size:11px;line-height:1}
.tile.armed{outline:2px solid #B4533F;outline-offset:-2px}
#recbar{position:fixed;left:16px;right:16px;bottom:16px;background:var(--card);border-radius:18px;padding:14px 18px;display:flex;align-items:center;gap:12px;box-shadow:0 8px 24px rgba(74,63,53,.2)}
#recbar .dot{color:#B4533F}
#recbar .t{flex:1;font-variant-numeric:tabular-nums}
#recbar button{border:0;border-radius:12px;padding:8px 12px;font-size:13px}
#sheet,#menu{position:fixed;inset:0;background:rgba(74,63,53,.34);display:flex;align-items:flex-end}
.sheet-card,.menu-card{background:var(--card);border-radius:22px 22px 0 0;padding:22px 20px 26px;width:100%;max-height:80vh;overflow-y:auto}
.sheet-card h2{font-family:Georgia,serif;font-size:21px;font-weight:400;margin:0 0 10px}
.sheet-card p{color:var(--muted);font-size:14px;line-height:1.55;margin:0 0 10px}
.sheet-card input.t{margin:8px 0 16px;border-bottom:1px solid var(--sand);border-radius:0}
.sheet-card ul{margin:0 0 14px;padding-left:18px;color:var(--ink);font-size:14px;line-height:1.6}
.sheet-card .row{display:flex;gap:10px;justify-content:flex-end;padding-top:6px;flex-wrap:wrap}
.sheet-card .row button,.menu-card button{border:0;border-radius:14px;padding:11px 16px;font-size:15px;background:var(--sand);color:var(--ink)}
.sheet-card .row .go{background:var(--tan);color:#fff}
.sheet-card .row .go[data-armed]{background:#B4533F}
.sheet-card .pick{display:block;width:100%;text-align:left;border:0;background:none;padding:14px 2px;border-bottom:1px solid var(--sand);border-radius:0;font-family:Georgia,serif;font-size:18px;color:var(--ink)}
.sheet-card .pick i{display:block;font-style:normal;font-family:-apple-system,Roboto,system-ui,sans-serif;font-size:12.5px;color:var(--muted);margin-top:3px}
.menu-card button{display:block;width:100%;text-align:left;margin-bottom:8px;background:none;font-size:16px;padding:12px 6px;border-bottom:1px solid var(--sand);border-radius:0}
#say{position:fixed;left:50%;transform:translateX(-50%);bottom:110px;background:var(--ink);color:#fff;padding:10px 16px;border-radius:14px;font-size:13px;max-width:80%;text-align:center}
</style>
</head>
<body>
<header id="bar"><div id="brand">UJournal</div><button id="more" title="Back up or move to a new device">⋯</button><button id="tip" title="Support UJournal">♥</button><button id="check" title="Check for updates">⟳</button></header>
<main id="view"></main>
<nav id="tabs" class="hide"><button id="t0" class="on">📖<span>Journal</span></button><button id="t1">📅<span>Calendar</span></button><button id="t2">🎉<span>Plans</span></button></nav>
<button id="fab" class="hide">＋</button>

<section id="day" class="hide">
  <div class="day-bar"><button id="back">‹ Back</button><button id="attach">＋ Attach</button></div>
  <div id="day-body"></div>
</section>
<div id="recbar" class="hide"></div>
<div id="sheet" class="hide"><div class="sheet-card" id="sheet-card"></div></div>
<div id="menu" class="hide"><div class="menu-card" id="menu-card"></div></div>
<div id="say" class="hide"></div>

<script>
const JOURNAL_PAGE = "1.9.2";
(function () {
  "use strict";
  var G = window.Journal || null;
  var MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  var S = { tab: 0, name: "", entries: [], plans: [], day: null, ym: new Date(), saveTimer: null, rec: null, upd: null, wn: 0 };

  function $(id) { return document.getElementById(id); }
  function parse(t, d) { try { return t ? JSON.parse(t) : d; } catch (e) { return d; } }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function call(n) { try { return G && G[n] ? G[n].apply(G, Array.prototype.slice.call(arguments, 1)) : null; } catch (e) { return null; } }
  function fileUrl(p) { return p ? encodeURI("file://" + p) : ""; }
  function pad2(n) { return (n < 10 ? "0" : "") + n; }
  function key(y, m, d) { return y + "-" + pad2(m + 1) + "-" + pad2(d); }
  function asDate(s) { return new Date(s + "T12:00:00"); }
  function today() { var n = new Date(); return key(n.getFullYear(), n.getMonth(), n.getDate()); }
  function day(s) { try { return asDate(s).toLocaleDateString(undefined, { day: "numeric", month: "short" }); } catch (e) { return s; } }

  var sayTimer = null;
  function say(msg) {
    var el = $("say"); el.textContent = msg; el.classList.remove("hide");
    clearTimeout(sayTimer);
    sayTimer = setTimeout(function () { el.classList.add("hide"); }, 2600);
  }

  // ---- the journal ----

  // One journal, opened the moment the page starts. The shell keeps it in journals/<id>/..., and the
  // page never asks which book it is looking at: there is nothing to pick, and nothing to name
  // before the first word.
  function start() {
    S.name = call("currentJournal") || "UJournal";
    $("brand").textContent = S.name;
    $("tabs").classList.remove("hide");
    $("fab").classList.remove("hide");
    $("fab").style.display = "block";
    refresh();
    // A new screen says what changed in it - once, and only after it has been read.
    if (wnSeen() !== JOURNAL_PAGE) showWhatsNew();
  }

  function pickTab(n) {
    S.tab = n;
    draw();
  }

  // ---- the timeline ----

  function card(e) {
    var d = asDate(e.date);
    var vis = (e.atts || []).filter(function (a) { return /^(image|video)\//.test(a.mime || ""); })[0];
    var h = '<div class="card" data-date="' + esc(e.date) + '">';
    h += '<div class="dn"><b>' + d.getDate() + '</b><i>' + d.toLocaleDateString(undefined, { weekday: "short" }).slice(0, 3).toUpperCase() + '</i></div>';
    h += '<div class="txt"><div class="ti">' + esc(e.title || "Untitled") + '</div>';
    if (e.body) h += '<div class="bd">' + esc(e.body) + '</div>';
    if (e.atts && e.atts.length) h += '<div class="at">📎 ' + e.atts.length + '</div>';
    h += '</div>';
    if (vis) {
      if (/^image\//.test(vis.mime)) h += '<img class="thumb" src="' + fileUrl(vis.path) + '" alt="">';
      else h += '<div class="thumb p">▶</div>';
    }
    return h + '</div>';
  }

  function drawList() {
    var v = $("view");
    var todays = (S.plans || []).filter(function (p) { return onDay(p, today()); });
    var top = todays.length
      ? '<div class="month">Today</div>' + todays.map(function (p) { return planRow(p, "today"); }).join("")
      : "";
    if (!S.entries.length) {
      v.innerHTML = top + '<div class="empty">This journal is waiting.<br>Tap ＋ to write today.</div>' +
        othersCard();
      return;
    }
    var h = "", y = null, m = null;
    S.entries.forEach(function (e) {
      var d = asDate(e.date);
      if (d.getFullYear() !== y) { y = d.getFullYear(); m = null; h += '<div class="year">' + y + '</div>'; }
      if (d.getMonth() !== m) { m = d.getMonth(); h += '<div class="month">' + MONTHS[m] + '</div>'; }
      h += card(e);
    });
    v.innerHTML = top + h + othersCard();
  }

  // ---- the calendar ----

  function drawCal() {
    var y = S.ym.getFullYear(), m = S.ym.getMonth();
    var off = new Date(y, m, 1).getDay();
    var len = new Date(y, m + 1, 0).getDate();
    var have = {}, planned = {};
    S.entries.forEach(function (e) { have[e.date] = 1; });
    // A plan marks the days it covers. A birthday marks its month and day in every year, which is
    // kept apart from the full dates by having no year in the key at all.
    (S.plans || []).forEach(function (p) {
      if (p.kind === "birthday") { planned[String(p.start).slice(5)] = 1; return; }
      var from = p.start, to = planEnd(p);
      for (var i = 0; i < 400; i++) {
        var k = addDays(from, i);
        planned[k] = 1;
        if (k >= to) break;
      }
    });
    var h = '<div class="cal-head"><button data-ym="-12">«</button><button data-ym="-1">‹</button>' +
      '<div class="cal-title">' + MONTHS[m] + ' ' + y + '</div>' +
      '<button data-ym="1">›</button><button data-ym="12">»</button></div>';
    h += '<div class="dow"><span>S</span><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span></div><div class="grid">';
    for (var i = 0; i < off; i++) h += '<span></span>';
    for (var n = 1; n <= len; n++) {
      var k = key(y, m, n);
      var pl = planned[k] || planned[k.slice(5)];
      h += '<button class="' + (have[k] ? "has" : "") + (pl ? " pl" : "") + '" data-date="' + k + '">' + n + '</button>';
    }
    h += '</div><div class="today"><button data-today="1">Today</button></div>';
    $("view").innerHTML = h;
  }

  function draw() {
    var t = S.tab;
    $("t0").className = t === 0 ? "on" : "";
    $("t1").className = t === 1 ? "on" : "";
    $("t2").className = t === 2 ? "on" : "";
    $("fab").style.display = S.day || S.tab === 2 ? "none" : "block";
    if (S.tab === 0) drawList(); else if (S.tab === 1) drawCal(); else drawPlans();
  }

  function refresh(cb) {
    S.entries = parse(call("entries"), []) || [];
    S.plans = parse(call("plans"), []) || [];
    draw();
    repaintDay();
    if (cb) cb();
  }

  // ---- plans ----

  // A plan is a thing that happens: an hour on a Tuesday, a week away, or a birthday that comes
  // round every year. The day it starts and the day it ends are dates; the times are optional, so a
  // plan with no time in it is simply all day, and a birthday has no end at all.

  function addDays(s, n) {
    var d = asDate(s);
    d.setDate(d.getDate() + n);
    return key(d.getFullYear(), d.getMonth(), d.getDate());
  }

  function planEnd(p) { return p.end && p.end > p.start ? p.end : p.start; }

  function minsOf(t) {
    var p = String(t || "").split(":"), h = parseInt(p[0], 10), m = parseInt(p[1], 10);
    return isNaN(h) || isNaN(m) ? 0 : h * 60 + m;
  }

  function hhmm(n) {
    n = ((n % 1440) + 1440) % 1440;
    return pad2(Math.floor(n / 60)) + ":" + pad2(n % 60);
  }

  function hm(t) {
    var parts = String(t || "").split(":"), h = parseInt(parts[0], 10), m = parts[1] || "00";
    if (isNaN(h)) return "";
    var am = h >= 12 ? "pm" : "am", hh = h % 12;
    if (hh === 0) hh = 12;
    return hh + (m === "00" ? "" : ":" + m) + am;
  }

  function onDay(p, d) {
    if (p.kind === "birthday") return String(p.start).slice(5) === String(d).slice(5);
    return d >= p.start && d <= planEnd(p);
  }

  function whenLine(p) {
    if (p.kind === "birthday") return "Every year on " + day(p.start);
    var multi = planEnd(p) !== p.start;
    var head = multi ? day(p.start) + " – " + day(planEnd(p)) : day(p.start);
    if (!p.startTime) return head + " · all day";
    return head + " · " + hm(p.startTime) + (p.endTime && !multi ? " – " + hm(p.endTime) : "");
  }

  // When a birthday next comes round, so the list can run in the order the year will.
  function nextBirthday(p) {
    var now = new Date();
    var m = parseInt(String(p.start).slice(5, 7), 10), d = parseInt(String(p.start).slice(8, 10), 10);
    var at = new Date(now.getFullYear(), m - 1, d);
    if (at < new Date(now.getFullYear(), now.getMonth(), now.getDate())) at = new Date(now.getFullYear() + 1, m - 1, d);
    return at;
  }

  function daysAway(dateStr) {
    return Math.round((asDate(dateStr) - asDate(today())) / 86400000);
  }

  function planRow(p, extra) {
    var at = p.kind === "birthday" ? nextBirthday(p) : asDate(p.start);
    return '<div class="plan' + (extra === "today" ? " today" : "") + '" data-plan="' + esc(p.id) + '">' +
      '<div class="pdn"><b>' + at.getDate() + '</b><i>' + MONTHS[at.getMonth()].slice(0, 3).toUpperCase() + '</i></div>' +
      '<div class="pt"><b>' + esc(p.title || "Untitled plan") + '</b><i>' + esc(whenLine(p)) + '</i></div>' +
      (p.kind === "birthday" ? '<div class="cake">🎂</div>' : '') + '</div>';
  }

  function plansOn(date) {
    return (S.plans || []).filter(function (p) { return onDay(p, date); });
  }

  function drawPlans() {
    var all = S.plans || [];
    var todays = all.filter(function (p) { return onDay(p, today()); });
    var soon = all.filter(function (p) {
      return p.kind !== "birthday" && !onDay(p, today()) && daysAway(planEnd(p)) >= 0 && daysAway(p.start) <= 45;
    }).sort(function (a, b) { return (a.start + a.startTime).localeCompare(b.start + b.startTime); });
    var bdays = all.filter(function (p) { return p.kind === "birthday"; })
      .sort(function (a, b) { return nextBirthday(a) - nextBirthday(b); });
    var past = all.filter(function (p) { return p.kind !== "birthday" && planEnd(p) < today(); })
      .sort(function (a, b) { return b.start.localeCompare(a.start); }).slice(0, 12);

    var h = '<div class="hello">Plans</div>';
    h += '<button class="newj" data-plan-new="1"><span class="plus">＋</span><span>' +
      '<b>New plan</b><i>An hour, a few days away, or a birthday</i></span></button>' +
      famtmButton();
    if (!all.length) {
      h += '<div class="empty">Nothing planned yet.<br>A dinner, a trip, a birthday &mdash; it can all live here.</div>';
    } else {
      if (todays.length) {
        h += '<div class="month">Today</div>';
        todays.forEach(function (p) { h += planRow(p, "today"); });
      }
      if (soon.length) {
        h += '<div class="month">Coming up</div>';
        soon.forEach(function (p) { h += planRow(p); });
      }
      if (bdays.length) {
        h += '<div class="month">Birthdays</div>';
        bdays.forEach(function (p) { h += planRow(p); });
      }
      if (past.length) {
        h += '<div class="month">Earlier</div>';
        past.forEach(function (p) { h += planRow(p); });
      }
    }
    $("view").innerHTML = h + othersCard();

  // ---- birthdays from FamTM ----

  // FamTM keeps the birthday of everyone alive in the family, and hands that list over through a
  // read-only provider. The journal asks for it only when FamTM is installed, and only the name and
  // the day come across: they become birthday plans, which the calendar already marks in every year
  // without needing a date of their own.
  function famtmPending() {
    var n = parseInt(call("famtmBirthdays"), 10);
    return isNaN(n) || n < 0 ? 0 : n;
  }

  // 1.9.1 - BOTH WAYS. The bare import left the exchange one-sided: FamTM's birthdays arrived and
  // the ones typed here could never go back, because only FamTM published a list. The app now
  // publishes one too (see Birthdays.kt), so one tap does both halves and the card says so.
  function famtmButton() {
    var n = famtmPending();
    var line = n > 0
      ? (n === 1 ? "1 new birthday from FamTM" : n + " new birthdays from FamTM")
      : "Bring FamTM's across, and share yours back";
    return '<button class="fambtn" data-sync="1"><span class="fc">🎂</span><span>' +
      '<b>Sync birthdays</b><i>' + line + '</i></span></button>';
  }

  function runSync() {
    var r = parse(call("syncBirthdays"), null) || {};
    refresh();
    var added = parseInt(r.added, 10) || 0;
    var shared = parseInt(r.shared, 10) || 0;
    var installed = r.installed === true || r.installed === "true";
    var msg = added > 0
      ? (added === 1 ? "One birthday added from FamTM" : added + " birthdays added from FamTM")
      : (installed ? "FamTM had nothing new" : "Nothing new here, and FamTM is not installed");
    if (shared > 0) msg += " · " + (shared === 1 ? "1 shared back" : shared + " shared back");
    say(msg);
  }

  // One sheet for both kinds: the kind picks which fields matter, and a birthday only ever has a day.
  function showPlan(p, date) {
    var isNew = !p;
    var plan = p ? {
      id: p.id, title: p.title, start: p.start, startTime: p.startTime,
      end: p.end || p.start, endTime: p.endTime, kind: p.kind, note: p.note
    } : {
      id: "", title: "", start: date || today(), startTime: "",
      end: date || today(), endTime: "", kind: "event", note: ""
    };
    var kind = plan.kind === "birthday" ? "birthday" : "event";

    $("sheet-card").innerHTML =
      '<h2>' + (isNew ? "New plan" : "Edit plan") + '</h2>' +
      '<input id="pt" class="t nm" placeholder="What is it?" maxlength="80" value="' + esc(plan.title) + '">' +
      '<div class="chips"><button id="pke" class="chip">Event</button><button id="pkb" class="chip">Birthday</button></div>' +
      '<label class="fl">Day</label><input id="pd" class="fld" type="date" value="' + esc(plan.start) + '">' +
      '<div id="ptimes">' +
        '<label class="fl">Starts</label><input id="pst" class="fld" type="time" value="' + esc(plan.startTime) + '">' +
        '<label class="fl">How long</label><div class="durs" id="pdur"></div>' +
        '<label class="fl">Last day, if it runs over</label><input id="pe" class="fld" type="date" value="' + esc(plan.end > plan.start ? plan.end : "") + '">' +
      '</div>' +
      '<label class="fl">Notes</label><textarea id="pn" class="fld ta" placeholder="Optional">' + esc(plan.note) + '</textarea>' +
      '<div class="row"><button id="pcancel">Cancel</button>' +
      (isNew ? "" : '<button id="pdel">Delete</button>') +
      '<button id="psave" class="go">Save</button></div>';
    $("sheet").classList.remove("hide");

    // 1.9.1 - HOW LONG, NOT WHEN IT ENDS. A second clock used to ask for an end time, which meant
    // reading a dial and doing the arithmetic in your head. A plan now asks how long it lasts and
    // works the end out; All day is a length too, and the chips are the app's own tan.
    var DURS = [[0, "All day"], [30, "30 min"], [60, "1 hour"], [120, "2 hours"], [180, "3 hours"], [300, "5 hours"]];
    var durMin = plan.startTime ? (plan.endTime ? Math.max(0, minsOf(plan.endTime) - minsOf(plan.startTime)) : 60) : 0;

    function paintDur() {
      var host = $("pdur");
      if (!host) return;
      var list = DURS.slice();
      var known = false;
      list.forEach(function (d) { if (d[0] === durMin) known = true; });
      if (!known) list.splice(1, 0, [durMin, durMin + " min"]);
      host.innerHTML = list.map(function (d) {
        return '<button class="dur' + (d[0] === durMin ? " on" : "") + '" data-dur="' + d[0] + '">' + d[1] + '</button>';
      }).join("");
      host.querySelectorAll("[data-dur]").forEach(function (b) {
        b.onclick = function () {
          durMin = parseInt(b.getAttribute("data-dur"), 10) || 0;
          if (durMin > 0 && !$("pst").value) $("pst").value = "09:00";
          if (durMin === 0) $("pst").value = "";
          paintDur();
        };
      });
    }

    function paint() {
      $("pke").className = "chip" + (kind === "event" ? " on" : "");
      $("pkb").className = "chip" + (kind === "birthday" ? " on" : "");
      $("ptimes").style.display = kind === "birthday" ? "none" : "block";
      paintDur();
    }
    $("pke").onclick = function () { kind = "event"; paint(); };
    $("pkb").onclick = function () { kind = "birthday"; paint(); };
    $("pst").onchange = function () { if (!$("pst").value) { durMin = 0; paintDur(); } else if (durMin === 0) { durMin = 60; paintDur(); } };
    paint();

    $("pcancel").onclick = function () { $("sheet").classList.add("hide"); };
    if (!isNew) $("pdel").onclick = function () {
      if (!this.getAttribute("data-armed")) {
        this.setAttribute("data-armed", "1");
        this.textContent = "Delete this plan?";
        return;
      }
      call("removePlan", plan.id);
      $("sheet").classList.add("hide");
      refresh();
      say("Plan deleted");
    };
    $("psave").onclick = function () {
      var title = ($("pt").value || "").trim();
      if (!title) { say("Give the plan a name"); $("pt").focus(); return; }
      var start = $("pd").value || today();
      var out = { id: plan.id, title: title, kind: kind, start: start, startTime: "", end: start, endTime: "", note: ($("pn").value || "").trim() };
      if (kind === "event") {
        out.startTime = $("pst").value || "";
        // The end is the length added to the start; a plan that runs past midnight stops at 23:59
        // rather than silently reading as one that ends before it began.
        var finish = out.startTime && durMin > 0 ? minsOf(out.startTime) + durMin : 0;
        out.endTime = finish > 0 ? (finish >= 1440 ? "23:59" : hhmm(finish)) : "";
        var last = $("pe").value || "";
        out.end = last && last > start ? last : start;
      }
      call("savePlan", JSON.stringify(out));
      $("sheet").classList.add("hide");
      refresh();
      say(isNew ? "Plan saved" : "Plan changed");
    };
  }

  $("t1").onclick = function () { pickTab(1); };
  $("t2").onclick = function () { pickTab(2); };
  $("fab").onclick = function () { openDay(today()); };
  $("back").onclick = function () { closeDay(); };
  $("attach").onclick = openMenu;
  $("more").onclick = showMove;
  $("tip").onclick = showTips;
  $("check").onclick = function () { say("Checking for updates…"); call("checkUpdates"); };

  $("view").addEventListener("click", function (ev) {
    if (ev.target.closest("[data-tip]")) { showTips(); return; }
    if (ev.target.closest("[data-apps]")) { showOthers(); return; }
    if (ev.target.closest("[data-sync]")) { runSync(); return; }
    var np = ev.target.closest("[data-plan-new]");
    if (np) { var at = np.getAttribute("data-plan-new"); showPlan(null, at && at !== "1" ? at : today()); return; }
    var pr = ev.target.closest("[data-plan]");
    if (pr) { openPlanFrom(pr); return; }
    var c = ev.target.closest("[data-date]");
    if (c) { openDay(c.getAttribute("data-date")); return; }
    var y = ev.target.closest("[data-ym]");
    if (y) { S.ym = new Date(S.ym.getFullYear(), S.ym.getMonth() + parseInt(y.getAttribute("data-ym"), 10), 1); drawCal(); return; }
    if (ev.target.closest("[data-today]")) { S.ym = new Date(); drawCal(); }
  });

  // The day sheet holds plans of its own, so its taps are read here as well.
  $("day-body").addEventListener("click", function (ev) {
    var np = ev.target.closest("[data-plan-new]");
    if (np) { showPlan(null, np.getAttribute("data-plan-new") || S.day); return; }
    openPlanFrom(ev.target.closest("[data-plan]"));
  });

  // The shell asks this before it closes: true means the page handled the back itself.
  window.journalBack = function () {
    if (S.wn) { closeWhatsNew(); return true; }
    if (!$("menu").classList.contains("hide")) { $("menu").classList.add("hide"); return true; }
    if (!$("sheet").classList.contains("hide")) { $("sheet").classList.add("hide"); return true; }
    if (S.rec) { stopRec(false); return true; }
    if (S.day) { closeDay(); return true; }
    // At the top the back button belongs to Android: there is nowhere left to go inside the page.
    return false;
  };

  // What the shell calls back into: an attachment landed, there is an update, or something failed.
  window.JR = {
    attach: function (date) { reloadDay(date); refresh(); },
    update: function (json) { var u = parse(json, null); if (u) showUpdate(u); },
    toast: say
  };

  window.journalResume = function () { refresh(); };
  // onPause asks for whatever was typed to be on disk before the phone takes the screen away.
  window.journalFlush = saveNow;
  // The shell asks this before it swaps in a new screen: a day open means a draft being written, and
  // that is the only moment a page update is worth delaying.
  window.journalEditing = function () { return !!S.day; };

  start();
  call("ready");
})();
</script>
</body>
</html>
